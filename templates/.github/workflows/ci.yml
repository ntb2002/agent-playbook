name: CI

# The authoritative, server-side gate. Runs on every PR + push to main regardless of
# which machine/agent produced the commits, so it can't be bypassed like a local hook.
# Make `main` require this check via branch protection (see docs/git-workflow.md).
#
# ⚠️ This file is a scaffold: the job below fails on purpose until you replace it with
# your stack's install / lint / test steps. Copy the examples below or delete the
# placeholder job after you add real checks.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  not-configured:
    name: "CI not configured (customize me)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail until this workflow is customized
        run: |
          echo "::error::This workflow is still the agent-playbook placeholder."
          echo "Replace templates/.github/workflows/ci.yml (in your repo: .github/workflows/ci.yml)"
          echo "with real lint and test steps for your stack. See SETUP.md and the examples"
          echo "commented at the bottom of this file."
          exit 1

